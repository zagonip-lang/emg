        let selectedCategory = "All";

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" class="text-xs font-bold uppercase tracking-widest whitespace-nowrap py-1 transition-all relative ${selectedCategory === cat ? 'text-menuRed border-b-2 border-menuRed' : 'text-menuRed/40 hover:text-menuRed/80'}">${cat}</button>
            `).join('');
        }

        function scrollCategories(distance) { document.getElementById('categoryContainer').scrollBy({ left: distance, behavior: 'smooth' }); }
        function selectCategory(cat) { selectedCategory = cat; renderCategories(); filterProducts(); }

        function filterProducts() {
            if (selectedCategory !== "All") {
                renderSingleCategory(selectedCategory, products.filter(p => p.category === selectedCategory));
            } else {
                renderAllCategories();
            }
        }

        function renderAllCategories() {
            const container = document.getElementById('productList');
            container.innerHTML = '';
            categories.filter(cat => cat !== "All").forEach(cat => {
                const catProducts = products.filter(p => p.category === cat);
                if (catProducts.length > 0) {
                    const section = document.createElement('div');
                    section.className = 'space-y-3';
                    section.innerHTML = `<div class="text-center my-4"><h2 class="text-base font-bold uppercase tracking-widest text-menuRed font-sans border-b border-menuRed/15 pb-1 inline-block px-4">${cat}</h2></div><div class="bg-white/90 rounded-2xl border border-menuRed/10 divide-y divide-menuRed/5 px-5 py-1 shadow-sm">${catProducts.map(p => renderProductItem(p)).join('')}</div>`;
                    container.appendChild(section);
                }
            });
        }

        function renderSingleCategory(categoryName, items) {
            const container = document.getElementById('productList');
            if (items.length === 0) { container.innerHTML = `<p class="text-xs text-stone-400 text-center py-10">No products found.</p>`; return; }
            container.innerHTML = `<div class="space-y-3"><div class="text-center my-4"><h2 class="text-base font-bold uppercase tracking-widest text-menuRed font-sans border-b border-menuRed/15 pb-1 inline-block px-4">${categoryName}</h2></div><div class="bg-white/90 rounded-2xl border border-menuRed/10 divide-y divide-menuRed/5 px-5 py-1 shadow-sm">${items.map(p => renderProductItem(p)).join('')}</div></div>`;
        }

        function renderProductItem(p) {
            return `
                <div class="py-3.5 flex items-baseline justify-between gap-4 ${p.outOfStock ? 'opacity-40' : ''}">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2">
                            <p class="text-lg font-schoolbell text-menuRed font-bold tracking-wide leading-snug ${p.outOfStock ? 'line-through decoration-stone-400' : ''}">${p.name}</p>
                            ${p.outOfStock ? '<span class="text-[9px] bg-stone-200 text-stone-700 font-sans font-bold uppercase px-1.5 py-0.5 rounded">Out of Stock</span>' : ''}
                        </div>
                        ${p.desc ? `<p class="text-[11px] text-stone-500 leading-tight mt-0.5 font-sans">${p.desc}</p>` : ''}
                        ${p.badge ? `<span class="inline-block mt-1 text-[9px] text-menuRed/80 bg-menuRed/5 px-2 py-0.5 rounded-full font-semibold font-sans">${p.badge}</span>` : ''}
                    </div>
                    <div class="shrink-0 text-right"><span class="text-sm font-bold text-menuRed tracking-tight font-sans">${p.price}</span></div>
                </div>`;
        }

        renderCategories();
        filterProducts();
    </script>
