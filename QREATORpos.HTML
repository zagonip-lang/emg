<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Qreator POS - Core Only</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --bg-color: #030712;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-border: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(255, 255, 255, 0.05);
        --primary-color: #5ea1ff;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --glass-blur: blur(30px);
        --logo-gradient: linear-gradient(135deg, #5E17EB 0%, #C356F2 50%, #FF5757 100%);
    }

    /* BLOCARE STRICTĂ SCROLL ORIZONTAL */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    html, body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 90% 10%, #1e1b4b 0%, transparent 40%), #030712;
        color: var(--text-main); min-height: 100vh; padding: 10px; -webkit-font-smoothing: antialiased;
        overflow-x: hidden; width: 100%;
    }

    .app-screen { display: none; width: 100%; overflow-x: hidden; }
    .app-screen.active { display: block; }

    .pos-logo { height: 50px; width: auto; margin: 0 auto 10px auto; display: block; }

    /* LOGIN */
    .login-container { max-width: 340px; margin: 40px auto; text-align: center; display: flex; flex-direction: column; gap: 15px; }
    .pin-dots { display: flex; justify-content: center; gap: 15px; margin: 10px 0; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
    .pin-dot.active { background: var(--primary-color); box-shadow: 0 0 10px var(--primary-color); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .num-btn { background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px 0; font-size: 22px; font-weight: 600; color: #fff; cursor: pointer; }
    .num-btn:active { background: rgba(255,255,255,0.15); }

    /* NAVBAR */
    .header-terminal { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 4px; }
    .gemini-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px; backdrop-filter: var(--glass-blur); margin-bottom: 12px; width: 100%; }
    .action-badge { padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer; }

    /* EVENTS LAYOUT VERTICAL MOBIL */
    .events-layout { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; }
    .search-wrapper { position: relative; margin-bottom: 10px; }
    .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-input { width: 100%; padding: 12px 12px 12px 36px; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: 12px; color: #fff; font-size: 16px; outline: none; -webkit-user-select: text; user-select: text; }

    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; width: 100%; -webkit-overflow-scrolling: touch; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; white-space: nowrap; }
    .cat-btn.active { background: var(--logo-gradient); color: #fff; border-color: transparent; }
    
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; }
    .product-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 4px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; min-height: 80px; }
    .product-card b { font-size: 12px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .product-card span { font-size: 11px; color: var(--primary-color); font-weight: 700; }

    /* BON FISCAL */
    .bill-items { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; margin: 8px 0; }
    .bill-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.01); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--card-border); font-size: 13px; }
    .btn-delete-item { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger-color); width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .btn-block { width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--logo-gradient); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); color: #fff; }

    /* MASTER CORES */
    .master-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    .kpi-box { border-radius: 12px; padding: 14px; text-align: left; }
    .kpi-box h4 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .kpi-box .kpi-val { font-size: 20px; font-weight: 800; font-family: monospace; }
    .master-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    .master-table th, .master-table td { padding: 6px; border-bottom: 1px solid var(--card-border); text-align: left; }
    .master-input-cash { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px; color: #fff; width: 90px; text-align: center; outline: none; -webkit-user-select: text; user-select: text; }

    /* MODALE */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(2, 3, 6, 0.9); backdrop-filter:blur(10px); display:none; justify-content:center; align-items:center; z-index: 9999; padding: 10px; }
    .modal-box { background:#0f172a; border:1px solid var(--card-border); border-radius:20px; padding:18px; width:100%; max-width:340px; text-align:center; }
    .payment-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .pay-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 12px; font-size: 13px; font-weight: bold; border: none; color: #fff; cursor: pointer; }
</style>
</head>
<body>

    <div id="logo-svg-raw" style="display:none;">
        <svg class="pos-logo" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M547.072 87.5C547.072 344.664 639.141 490.5 773.535 490.5C639.141 490.5 547.072 636.336 547.072 893.5C547.072 636.336 455.002 490.5 320.609 490.5C455.002 490.5 547.072 344.664 547.072 87.5Z" fill="#5E17EB"/>
            <path d="M442.535 94.5C442.535 344.664 534.605 490.5 669 490.5C534.605 490.5 442.535 636.336 442.535 893.5C442.535 636.336 350.465 490.5 216.072 490.5C350.465 490.5 442.535 344.664 442.535 94.5Z" fill="#C356F2"/>
            <path d="M338 101.5C338 344.664 430.069 490.5 564.463 490.5C430.069 490.5 338 636.336 338 893.5C338 636.336 245.931 490.5 111.537 490.5C245.931 490.5 338 344.664 338 101.5Z" fill="#FF5757"/>
        </svg>
    </div>

    <div id="screen-login" class="app-screen active">
        <div class="login-container gemini-card">
            <div id="loginLogoInject"></div>
            <h2 style="color:#fff; font-size: 18px;">Qreator POS</h2>
            <p style="color:var(--text-muted); font-size:12px;">Introduceți codul PIN</p>
            <div class="pin-dots">
                <div class="pin-dot" id="l-dot0"></div>
                <div class="pin-dot" id="l-dot1"></div>
                <div class="pin-dot" id="l-dot2"></div>
                <div class="pin-dot" id="l-dot3"></div>
            </div>
            <div id="loginAlert" style="color:var(--danger-color); font-size:12px; display:none; font-weight:bold;"><i class="fa-solid fa-triangle-exclamation"></i> PIN incorect! (7777 sau 0000)</div>
            <div class="numpad">
                <button class="num-btn" onclick="pressPin(1)">1</button>
                <button class="num-btn" onclick="pressPin(2)">2</button>
                <button class="num-btn" onclick="pressPin(3)">3</button>
                <button class="num-btn" onclick="pressPin(4)">4</button>
                <button class="num-btn" onclick="pressPin(5)">5</button>
                <button class="num-btn" onclick="pressPin(6)">6</button>
                <button class="num-btn" onclick="pressPin(7)">7</button>
                <button class="num-btn" onclick="pressPin(8)">8</button>
                <button class="num-btn" onclick="pressPin(9)">9</button>
                <button class="num-btn" style="color:var(--danger-color);" onclick="clearPin()">C</button>
                <button class="num-btn" onclick="pressPin(0)">0</button>
                <button class="num-btn" style="color:var(--primary-color);" onclick="backPin()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <div id="screen-events" class="app-screen">
        <div class="header-terminal">
            <span style="font-weight:bold; font-size:15px;"><i class="fa-solid fa-bolt" style="color:var(--primary-color);"></i> Mod: EVENTS</span>
            <button class="action-badge" style="background:rgba(239,68,68,0.15); color:var(--danger-color); border:none;" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>

        <div class="events-layout">
            <div class="gemini-card">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="search-input" id="searchProduseInput" placeholder="Caută produs..." oninput="filtreazaProduse()">
                </div>
                <div class="categories-bar" id="categoriiBar"></div>
                <div class="products-grid" id="catalogProduse"></div>
            </div>
            
            <div class="gemini-card">
                <div style="font-weight:700; font-size:14px; border-bottom:1px solid var(--card-border); padding-bottom:6px; margin-bottom:6px;">Bon Vânzare Directă</div>
                <div class="bill-items" id="elementeBon"></div>
                <div style="background:rgba(255,255,255,0.02); border:1px solid var(--card-border); padding:10px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:between; font-size:15px; font-weight:800;">
                    <span>Total de plată:</span>
                    <span id="txtTotal" style="color:var(--primary-color); margin-left:auto;">0.00 lei</span>
                </div>
                <button class="btn-block btn-primary" onclick="deschidePlata()"><i class="fa-solid fa-cash-register"></i> Încasează rapid</button>
            </div>
        </div>
    </div>

    <div id="screen-master" class="app-screen">
        <div class="header-terminal">
            <span style="font-weight:bold; font-size:15px; color:var(--danger-color);"><i class="fa-solid fa-user-gear"></i> GESTIUNE MASTER</span>
            <button class="action-badge" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Ieșire</button>
        </div>

        <div class="master-grid">
            <div class="gemini-card kpi-box" style="background:rgba(94, 23, 235, 0.1); border-color: rgba(94, 23, 235, 0.3);">
                <h4>Încasări Vânzări Azi</h4>
                <div class="kpi-val" id="txtKPIIncasari">0.00 lei</div>
            </div>
            <div class="gemini-card kpi-box">
                <h4>Sold Actual Sertar</h4>
                <div class="kpi-val" id="txtMasterSold" style="color:var(--success-color);">100.00 lei</div>
            </div>
            <div class="gemini-card" style="display:flex; gap:6px; align-items:center; padding:10px;">
                <input type="number" class="master-input-cash" id="numSumaSertar" placeholder="Suma">
                <button class="action-badge" style="background:var(--success-color); color:#000; padding:8px 12px;" onclick="modificaFond('intrare')"><i class="fa-solid fa-plus"></i></button>
                <button class="action-badge" style="background:var(--danger-color); color:#fff; padding:8px 12px;" onclick="modificaFond('iesire')"><i class="fa-solid fa-minus"></i></button>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
            <button class="btn-block" style="background:rgba(255,255,255,0.04); color:#fff; border:1px solid var(--card-border);" onclick="raport('X')">RAPORT X</button>
            <button class="btn-block" style="background:var(--danger-color); color:#fff;" onclick="raport('Z')">RAPORT Z</button>
        </div>

        <div class="gemini-card" style="margin-top:12px;">
            <h4 style="font-size:13px; margin-bottom:8px;"><i class="fa-solid fa-list-check"></i> Jurnal Activitate Gestiune</h4>
            <div style="overflow-x:auto;">
                <table class="master-table">
                    <thead>
                        <tr><th>Tip</th><th>Sumă</th><th>Mod</th></tr>
                    </thead>
                    <tbody id="listaJurnal"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalPlata">
        <div class="modal-box">
            <h4>Alege Metoda de Plată</h4>
            <p id="txtSumaDePlata" style="margin:10px 0; font-size:18px; color:var(--primary-color); font-weight:800;"></p>
            <div class="payment-options-grid">
                <button class="pay-btn" style="background:#10b981;" onclick="finalizeazaVanzare('Cash')"><i class="fa-solid fa-money-bill-wave"></i> CASH</button>
                <button class="pay-btn" style="background:#3b82f6;" onclick="finalizeazaVanzare('Card')"><i class="fa-solid fa-credit-card"></i> CARD</button>
            </div>
            <button class="btn-block btn-secondary" style="margin-top:10px;" onclick="inchideModal()">Anulează</button>
        </div>
    </div>

<script>
let pinIntroduis = "";
let userRol = "";
let categorieCurenta = "Bar";
let textCautare = "";
let bonCurent = [];

let soldSertar = parseFloat(localStorage.getItem("q_core_sold")) || 100.00;
let jurnalActivitati = JSON.parse(localStorage.getItem("q_core_jurnal")) || [];

let produse = [
    { id: 1, nume: "Espresso Short", pret: 9, categorie: "Bar" },
    { id: 2, nume: "Frappe Clasic", pret: 16, categorie: "Bar" },
    { id: 3, nume: "Cappuccino", pret: 12, categorie: "Bar" },
    { id: 4, nume: "Coca-Cola Zero", pret: 9, categorie: "Sucuri" },
    { id: 5, nume: "Limonadă Clasic", pret: 15, categorie: "Sucuri" },
    { id: 6, nume: "Bere Ursus", pret: 11, categorie: "Bere" },
    { id: 7, nume: "Bere Heineken", pret: 14, categorie: "Bere" },
    { id: 8, nume: "Papanși", pret: 24, categorie: "Desert" },
    { id: 9, nume: "Lava Cake", pret: 22, categorie: "Desert" }
];

window.onload = function() {
    document.getElementById("loginLogoInject").innerHTML = document.getElementById("logo-svg-raw").innerHTML;
};

function pressPin(n) {
    if(pinIntroduis.length >= 4) return; pinIntroduis += n; updatePinDots();
    if(pinIntroduis.length === 4) setTimeout(login, 120);
}
function clearPin() { pinIntroduis = ""; updatePinDots(); }
function backPin() { pinIntroduis = pinIntroduis.slice(0, -1); updatePinDots(); }
function updatePinDots() {
    document.getElementById("loginAlert").style.display = "none";
    for(let i=0; i<4; i++) document.getElementById(`l-dot${i}`).classList.toggle("active", i < pinIntroduis.length);
}

function login() {
    if(pinIntroduis === "7777") { userRol = "events"; randeazaEvents(); }
    else if(pinIntroduis === "0000") { userRol = "master"; randeazaMaster(); }
    else { document.getElementById("loginAlert").style.display = "block"; clearPin(); }
}

function logout() {
    clearPin();
    document.getElementById("screen-events").classList.remove("active");
    document.getElementById("screen-master").classList.remove("active");
    document.getElementById("screen-login").classList.add("active");
}

/* FLUX EVENTS */
function randeazaEvents() {
    document.getElementById("screen-login").classList.remove("active");
    document.getElementById("screen-events").classList.add("active");
    bonCurent = [];
    textCautare = "";
    document.getElementById("searchProduseInput").value = "";
    actualizeazaCategorii(); randeazaCatalog(); actualizeazaBonul();
}

function actualizeazaCategorii() {
    const bar = document.getElementById("categoriiBar"); bar.innerHTML = "";
    if(textCautare !== "") { bar.innerHTML = `<span style="font-size:11px; color:var(--text-muted);">Căutare activă</span>`; return; }
    ["Bar", "Sucuri", "Bere", "Desert"].forEach(c => {
        bar.innerHTML += `<button class="cat-btn ${c===categorieCurenta?'active':''}" onclick="categorieCurenta='${c}'; actualizeazaCategorii(); randeazaCatalog();">${c}</button>`;
    });
}

function randeazaCatalog() {
    const grid = document.getElementById("catalogProduse"); grid.innerHTML = "";
    let lista = textCautare !== "" ? produse.filter(p => p.nume.toLowerCase().includes(textCautare.toLowerCase())) : produse.filter(p => p.categorie === categorieCurenta);
    lista.forEach(p => {
        grid.innerHTML += `<div class="product-card" onclick="adaugaProdus(${p.id})"><b>${p.nume}</b><span>${p.pret} lei</span></div>`;
    });
}

function filtreazaProduse() {
    textCautare = document.getElementById("searchProduseInput").value.trim();
    actualizeazaCategorii(); randeazaCatalog();
}

function adaugaProdus(id) {
    let p = produse.find(x => x.id === id);
    let exist = bonCurent.find(x => x.id === id);
    if(exist) exist.cantitate++; else bonCurent.push({...p, cantitate: 1});
    actualizeazaBonul();
}

function eliminaProdus(id) {
    let idx = bonCurent.findIndex(x => x.id === id);
    if(idx !== -1) {
        if(bonCurent[idx].cantitate > 1) bonCurent[idx].cantitate--;
        else bonCurent.splice(idx, 1);
    }
    actualizeazaBonul();
}

function actualizeazaBonul() {
    const container = document.getElementById("elementeBon"); container.innerHTML = "";
    let total = 0;
    bonCurent.forEach(i => {
        total += i.pret * i.cantitate;
        container.innerHTML += `<div class="bill-item"><div><b>${i.nume}</b><br><small>${i.cantitate} x ${i.pret} lei</small></div><div style="display:flex; align-items:center; gap:8px;"><span>${(i.pret*i.cantitate)} lei</span><button class="btn-delete-item" onclick="eliminaProdus(${i.id})"><i class="fa-solid fa-minus"></i></button></div></div>`;
    });
    document.getElementById("txtTotal").innerText = total.toFixed(2) + " lei";
}

function deschidePlata() {
    if(bonCurent.length === 0) return;
    let total = bonCurent.reduce((s,i) => s + (i.pret*i.cantitate), 0);
    document.getElementById("txtSumaDePlata").innerText = total.toFixed(2) + " lei";
    document.getElementById("modalPlata").style.display = "flex";
}

function finalizeazaVanzare(metoda) {
    let total = bonCurent.reduce((s,i) => s + (i.pret*i.cantitate), 0);
    jurnalActivitati.push({ tip: "Vânzare (Events)", suma: total, metoda: metoda });
    if(metoda === "Cash") soldSertar += total;
    
    localStorage.setItem("q_core_sold", soldSertar);
    localStorage.setItem("q_core_jurnal", JSON.stringify(jurnalActivitati));
    
    inchideModal();
    bonCurent = [];
    actualizeazaBonul();
    alert("Bon fiscal trimis spre casa de marcat!");
}

function inchideModal() { document.getElementById("modalPlata").style.display = "none"; }

/* FLUX MASTER */
function randeazaMaster() {
    document.getElementById("screen-login").classList.remove("active");
    document.getElementById("screen-master").classList.add("active");
    actualizeazaPanouMaster();
}

function actualizeazaPanouMaster() {
    let vanzariAzi = jurnalActivitati.filter(j => j.tip.includes("Vânzare")).reduce((s,j) => s + j.suma, 0);
    document.getElementById("txtKPIIncasari").innerText = vanzariAzi.toFixed(2) + " lei";
    document.getElementById("txtMasterSold").innerText = soldSertar.toFixed(2) + " lei";

    const tbody = document.getElementById("listaJurnal"); tbody.innerHTML = "";
    if(jurnalActivitati.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Fără activitate.</td></tr>`;
        return;
    }
    [...jurnalActivitati].reverse().forEach(j => {
        let isPlus = j.tip.includes("Vânzare") || j.tip.includes("Alimentare");
        tbody.innerHTML += `<tr>
            <td><b>${j.tip}</b></td>
            <td style="color:${isPlus?'var(--success-color)':'var(--danger-color)'}; font-family:monospace;">${j.suma.toFixed(2)} lei</td>
            <td>${j.metoda}</td>
        </tr>`;
    });
}

function modificaFond(dir) {
    let input = document.getElementById("numSumaSertar");
    let val = parseFloat(input.value);
    if(isNaN(val) || val <= 0) return;

    if(dir === "intrare") {
        soldSertar += val;
        jurnalActivitati.push({ tip: "Alimentare Sertar", suma: val, metoda: "Cash" });
    } else {
        if(val > soldSertar) { alert("Fonduri insuficiente!"); return; }
        soldSertar -= val;
        jurnalActivitati.push({ tip: "Retragere Fond", suma: val, metoda: "Cash" });
    }
    input.value = "";
    localStorage.setItem("q_core_sold", soldSertar);
    localStorage.setItem("q_core_jurnal", JSON.stringify(jurnalActivitati));
    actualizeazaPanouMaster();
}

function raport(tip) {
    let vanzari = jurnalActivitati.filter(j => j.tip.includes("Vânzare")).reduce((s,j) => s + j.suma, 0);
    alert(`=== RAPORT ${tip} ===\nTotal încasări: ${vanzari.toFixed(2)} lei\nSold Sertar: ${soldSertar.toFixed(2)} lei`);
    if(tip === 'Z') {
        jurnalActivitati = [];
        localStorage.setItem("q_core_jurnal", JSON.stringify(jurnalActivitati));
        actualizeazaPanouMaster();
    }
}
</script>
</body>
</html>
