<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Qreator POS - Clean Touch UI</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --bg-color: #0b0f19;
        --card-bg: rgba(255, 255, 255, 0.04);
        --card-border: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(255, 255, 255, 0.07);
        --primary-color: #4f46e5;
        --primary-light: #6366f1;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --logo-gradient: linear-gradient(135deg, #5E17EB 0%, #C356F2 50%, #FF5757 100%);
    }

    /* RESET & BLOCARE SCROLL */
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        -webkit-user-select: none; 
        user-select: none; 
        touch-action: manipulation; /* Elimină delay-ul de touch pe mobile */
    }
    
    html, body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 70%);
        color: var(--text-main); 
        min-height: 100vh; 
        padding: 12px; 
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden; 
        width: 100%;
    }

    .app-screen { display: none; width: 100%; overflow-x: hidden; }
    .app-screen.active { display: block; }

    .pos-logo { height: 60px; width: auto; margin: 0 auto 15px auto; display: block; }

    /* CARD STYLING */
    .gemini-card { 
        background: var(--card-bg); 
        border: 1px solid var(--card-border); 
        border-radius: 20px; 
        padding: 16px; 
        backdrop-filter: blur(20px); 
        margin-bottom: 14px; 
        width: 100%; 
    }

    /* LOGIN & NUMPAD */
    .login-container { max-width: 360px; margin: 30px auto; text-align: center; }
    .pin-dots { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; }
    .pin-dot.active { background: var(--primary-light); box-shadow: 0 0 12px var(--primary-light); transform: scale(1.1); }
    
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
    .num-btn { 
        background: rgba(255,255,255,0.03); 
        border: 1px solid var(--card-border); 
        border-radius: 18px; 
        padding: 22px 0; 
        font-size: 24px; 
        font-weight: 600; 
        color: #fff; 
        cursor: pointer;
        transition: background 0.1s;
    }
    .num-btn:active { background: rgba(255,255,255,0.15); }

    /* HEADER */
    .header-terminal { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 4px; }
    .action-badge { padding: 10px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* CONTROALE INPUT (ANTI-ZOOM) */
    input, input:focus, input[type="text"], input[type="number"] {
        font-size: 16px !important; /* Soluția critică împotriva zoom-ului pe iOS */
    }

    .search-wrapper { position: relative; margin-bottom: 14px; }
    .search-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
    .search-input { width: 100%; padding: 14px 14px 14px 44px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 14px; color: #fff; outline: none; -webkit-user-select: text; user-select: text; }

    /* CATEGORII (TOUCH HORIZONTAL) */
    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; width: 100%; -webkit-overflow-scrolling: touch; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); color: var(--text-muted); padding: 12px 20px; border-radius: 14px; font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--logo-gradient); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(94, 23, 235, 0.3); }
    
    /* GRID PRODUSE (BUTOANE MARI) */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; max-height: 320px; overflow-y: auto; }
    .product-card { 
        background: rgba(255, 255, 255, 0.02); 
        border: 1px solid var(--card-border); 
        border-radius: 16px; 
        padding: 14px 8px; 
        text-align: center; 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
        min-height: 95px;
        cursor: pointer;
    }
    .product-card:active { background: rgba(255,255,255,0.08); transform: scale(0.97); }
    .product-card b { font-size: 13px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
    .product-card span { font-size: 12px; color: var(--primary-light); font-weight: 700; }

    /* BON / COȘ CURENT */
    .bill-items { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; margin: 10px 0; }
    .bill-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 14px; border: 1px solid var(--card-border); }
    
    /* TOUCH CONTROLS CANTITATE (+/-) */
    .qty-controls { display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.2); padding: 2px; border-radius: 10px; border: 1px solid var(--card-border); }
    .btn-qty { background: rgba(255,255,255,0.05); border: none; color: #fff; width: 32px; height: 32px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-qty:active { background: rgba(255,255,255,0.2); }
    .qty-num { min-width: 24px; text-align: center; font-size: 13px; font-weight: 700; }

    /* BUTOANE GENERALE DE ACȚIUNE */
    .btn-block { width: 100%; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-primary { background: var(--logo-gradient); color: #fff; box-shadow: 0 4px 15px rgba(94, 23, 235, 0.4); }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
    .btn-secondary { background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); color: #fff; }

    /* INTERFAȚĂ MASTER & JURNAL */
    .master-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 10px; }
    .kpi-box { border-radius: 16px; padding: 16px; text-align: left; }
    .kpi-box h4 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .kpi-box .kpi-val { font-size: 24px; font-weight: 800; font-family: monospace; }
    
    .master-action-row { display: flex; gap: 8px; align-items: center; padding: 12px; background: rgba(255,255,255,0.01); border-radius: 16px; border: 1px solid var(--card-border); }
    .master-input-cash { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; color: #fff; width: 100px; text-align: center; outline: none; font-weight: bold; -webkit-user-select: text; user-select: text; }
    .btn-master-add { background: var(--success-color) !important; color: #000 !important; font-size: 16px; width: 48px; height: 48px; border-radius: 12px; border: none; cursor: pointer; }
    .btn-master-sub { background: var(--danger-color) !important; color: #fff !important; font-size: 16px; width: 48px; height: 48px; border-radius: 12px; border: none; cursor: pointer; }

    .master-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .master-table th, .master-table td { padding: 10px 6px; border-bottom: 1px solid var(--card-border); text-align: left; }

    /* DIALOG MODAL SPRE INCASARE */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(4, 6, 14, 0.85); backdrop-filter:blur(15px); display:none; justify-content:center; align-items:center; z-index: 9999; padding: 16px; }
    .modal-box { background:#0f172a; border:1px solid var(--card-border); border-radius:24px; padding:22px; width:100%; max-width:355px; text-align:center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .payment-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .pay-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 22px 10px; border-radius: 16px; font-size: 14px; font-weight: bold; border: none; color: #fff; cursor: pointer; }
    .pay-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

    <div id="logo-svg-raw" style="display:none;">
        <svg class="pos-logo" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M547.072 87.5C547.072 344.664 639.141 490.5 773.535 490.5C639.141 490.5 547.072 636.336 547.072 893.5C547.072 636.336 455.002 490.5 320.609 490.5C455.002 490.5 547.072 344.664 547.072 87.5Z" fill="#5E17EB"/>
            <path d="M442.535 94.5C442.535 344.664 534.605 490.5 669 490.5C534.605 490.5 442.535 636.336 442.535 893.5C442.535 636.336 350.465 490.5 216.072 490.5C350.465 490.5 442.535 344.664 442.535 94.5Z" fill="#C356F2"/>
            <path d="M338 101.5C338 344.664 430.069 490.5 564.463 490.5C430.069 490.5 338 636.336 338 893.5C338 636.336 245.931 490.5 111.537 490.5C245.931 490.5 338 344.664 338 101.5Z" fill="#FF5757"/>
        </svg>
    </div>

    <div id="screen-login" class="app-screen active">
        <div class="login-container gemini-card">
            <div id="loginLogoInject"></div>
            <h2 style="color:#fff; font-size: 20px; font-weight: 700; margin-bottom: 2px;">Qreator POS</h2>
            <p style="color:var(--text-muted); font-size:13px;">Introduceți codul PIN de acces</p>
            <div class="pin-dots">
                <div class="pin-dot" id="l-dot0"></div>
                <div class="pin-dot" id="l-dot1"></div>
                <div class="pin-dot" id="l-dot2"></div>
                <div class="pin-dot" id="l-dot3"></div>
            </div>
            <div id="loginAlert" style="color:var(--danger-color); font-size:13px; display:none; font-weight:bold; margin-bottom:10px;"><i class="fa-solid fa-triangle-exclamation"></i> PIN incorect! (7777 / 0000)</div>
            <div class="numpad">
                <button class="num-btn" onclick="pressPin(1)">1</button>
                <button class="num-btn" onclick="pressPin(2)">2</button>
                <button class="num-btn" onclick="pressPin(3)">3</button>
                <button class="num-btn" onclick="pressPin(4)">4</button>
                <button class="num-btn" onclick="pressPin(5)">5</button>
                <button class="num-btn" onclick="pressPin(6)">6</button>
                <button class="num-btn" onclick="pressPin(7)">7</button>
                <button class="num-btn" onclick="pressPin(8)">8</button>
                <button class="num-btn" onclick="pressPin(9)">9</button>
                <button class="num-btn" style="color:var(--danger-color);" onclick="clearPin()">C</button>
                <button class="num-btn" onclick="pressPin(0)">0</button>
                <button class="num-btn" style="color:var(--primary-light);" onclick="backPin()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <div id="screen-events" class="app-screen">
        <div class="header-terminal">
            <span style="font-weight:700; font-size:16px; display:flex; align-items:center; gap:6px;"><i class="fa-solid fa-bolt" style="color:#fbbf24;"></i> Mod: EVENTS</span>
            <button class="action-badge" style="background:rgba(239,68,68,0.12); color:var(--danger-color); border:none;" onclick="logout()"><i class="fa-solid fa-power-off"></i> Ieșire</button>
        </div>

        <div class="events-layout">
            <div class="gemini-card">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="search-input" id="searchProduseInput" placeholder="Caută rapid un produs..." oninput="filtreazaProduse()">
                </div>
                <div class="categories-bar" id="categoriiBar"></div>
                <div class="products-grid" id="catalogProduse"></div>
            </div>
            
            <div class="gemini-card">
                <div style="font-weight:700; font-size:15px; border-bottom:1px solid var(--card-border); padding-bottom:8px; margin-bottom:8px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Articole Coș</div>
                <div class="bill-items" id="elementeBon"></div>
                
                <div style="background:rgba(0,0,0,0.15); border:1px solid var(--card-border); padding:14px; border-radius:14px; margin:14px 0; display:flex; justify-content:between; font-size:16px; font-weight:800;">
                    <span>Total de plată:</span>
                    <span id="txtTotal" style="color:var(--success-color); margin-left:auto;">0.00 lei</span>
                </div>
                <button class="btn-block btn-primary" onclick="deschidePlata()"><i class="fa-solid fa-cash-register"></i> ÎNCASEAZĂ RAPID</button>
            </div>
        </div>
    </div>

    <div id="screen-master" class="app-screen">
        <div class="header-terminal">
            <span style="font-weight:700; font-size:16px; color:#a5b4fc; display:flex; align-items:center; gap:6px;"><i class="fa-solid fa-user-gear"></i> GESTIUNE MASTER</span>
            <button class="action-badge" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Lock POS</button>
        </div>

        <div class="master-grid">
            <div class="gemini-card kpi-box" style="background:rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.25);">
                <h4>Încasări Vânzări Azi</h4>
                <div class="kpi-val" id="txtKPIIncasari">0.00 lei</div>
            </div>
            <div class="gemini-card kpi-box" style="background:rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.25);">
                <h4>Sold Actual Sertar (Cash)</h4>
                <div class="kpi-val" id="txtMasterSold" style="color:var(--success-color);">100.00 lei</div>
            </div>
            
            <div class="master-action-row">
                <input type="number" class="master-input-cash" id="numSumaSertar" placeholder="0.00">
                <span style="color:var(--text-muted); font-size:14px; margin-right:auto;">lei</span>
                <button class="btn-master-add" onclick="modificaFond('intrare')"><i class="fa-solid fa-plus"></i></button>
                <button class="btn-master-sub" onclick="modificaFond('iesire')"><i class="fa-solid fa-minus"></i></button>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:14px;">
            <button class="btn-block btn-secondary" onclick="raport('X')"><i class="fa-solid fa-print"></i> RAPORT X</button>
            <button class="btn-block" style="background:var(--danger-color); color:#fff; font-weight:bold;" onclick="raport('Z')"><i class="fa-solid fa-circle-stop"></i> RAPORT Z (ÎNCHIDERE)</button>
        </div>

        <div class="gemini-card" style="margin-top:14px;">
            <h4 style="font-size:14px; margin-bottom:10px; font-weight:700;"><i class="fa-solid fa-list-check" style="color:var(--primary-light);"></i> Jurnal Tranzacții / Activitate</h4>
            <div style="overflow-x:auto;">
                <table class="master-table">
                    <thead>
                        <tr><th style="color:var(--text-muted);">Operațiune</th><th style="color:var(--text-muted);">Sumă</th><th style="color:var(--text-muted);">Tip</th></tr>
                    </thead>
                    <tbody id="listaJurnal"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalPlata">
        <div class="modal-box">
            <h3 style="font-size:18px; font-weight:700;">Finalizare Tranzacție</h3>
            <p id="txtSumaDePlata" style="margin:14px 0; font-size:24px; color:var(--success-color); font-weight:800; font-family:monospace;"></p>
            <div class="payment-options-grid">
                <button class="pay-btn" style="background:#10b981;" onclick="finalizeazaVanzare('Cash')"><i class="fa-solid fa-money-bill-wave" style="font-size:20px;"></i> CASH</button>
                <button class="pay-btn" style="background:#3b82f6;" onclick="finalizeazaVanzare('Card')"><i class="fa-solid fa-credit-card" style="font-size:20px;"></i> CARD</button>
            </div>
            <button class="btn-block btn-secondary" style="margin-top:14px; border-radius:12px;" onclick="inchideModal()">Înapoi la coș</button>
        </div>
    </div>

<script>
let pinIntroduis = "";
let userRol = "";
let categorieCurenta = "Bar";
let textCautare = "";
let bonCurent = [];

let soldSertar = parseFloat(localStorage.getItem("q_core_sold")) || 100.00;
let jurnalActivitati = JSON.parse(localStorage.getItem("q_core_jurnal")) || [];

let produse = [
    { id: 1, nume: "Espresso Short", pret: 9, categorie: "Bar" },
    { id: 2, nume: "Frappe Clasic", pret: 16, categorie: "Bar" },
    { id: 3, nume: "Cappuccino", pret: 12, categorie: "Bar" },
    { id: 4, nume: "Coca-Cola Zero", pret: 9, categorie: "Sucuri" },
    { id: 5, nume: "Limonadă Clasic", pret: 15, categorie: "Sucuri" },
    { id: 6, nume: "Bere Ursus", pret: 11, categorie: "Bere" },
    { id: 7, nume: "Bere Heineken", pret: 14, categorie: "Bere" },
    { id: 8, nume: "Papanși", pret: 24, categorie: "Desert" },
    { id: 9, nume: "Lava Cake", pret: 22, categorie: "Desert" }
];

window.onload = function() {
    document.getElementById("loginLogoInject").innerHTML = document.getElementById("logo-svg-raw").innerHTML;
};

function pressPin(n) {
    if(pinIntroduis.length >= 4) return; pinIntroduis += n; updatePinDots();
    if(pinIntroduis.length === 4) setTimeout(login, 120);
}
function clearPin() { pinIntroduis = ""; updatePinDots(); }
function backPin() { pinIntroduis = pinIntroduis.slice(0, -1); updatePinDots(); }
function updatePinDots() {
    document.getElementById("loginAlert").style.display = "none";
    for(let i=0; i<4; i++) document.getElementById(`l-dot${i}`).classList.toggle("active", i < pinIntroduis.length);
}

function login() {
    if(pinIntroduis === "7777") { userRol = "events"; randeazaEvents(); }
    else if(pinIntroduis === "0000") { userRol = "master"; randeazaMaster(); }
    else { document.getElementById("loginAlert").style.display = "block"; clearPin(); }
}

function logout() {
    clearPin();
    document.getElementById("screen-events").classList.remove("active");
    document.getElementById("screen-master").classList.remove("active");
    document.getElementById("screen-login").classList.add("active");
}

/* MODUL EVENTS */
function randeazaEvents() {
    document.getElementById("screen-login").classList.remove("active");
    document.getElementById("screen-events").classList.add("active");
    bonCurent = [];
    textCautare = "";
    document.getElementById("searchProduseInput").value = "";
    actualizeazaCategorii(); randeazaCatalog(); actualizeazaBonul();
}

function actualizeazaCategorii() {
    const bar = document.getElementById("categoriiBar"); bar.innerHTML = "";
    if(textCautare !== "") { bar.innerHTML = `<span style="font-size:12px; color:var(--text-muted); padding:10px 0;">Mod căutare activ</span>`; return; }
    ["Bar", "Sucuri", "Bere", "Desert"].forEach(c => {
        bar.innerHTML += `<button class="cat-btn ${c===categorieCurenta?'active':''}" onclick="categorieCurenta='${c}'; actualizeazaCategorii(); randeazaCatalog();">${c}</button>`;
    });
}

function randeazaCatalog() {
    const grid = document.getElementById("catalogProduse"); grid.innerHTML = "";
    let lista = textCautare !== "" ? produse.filter(p => p.nume.toLowerCase().includes(textCautare.toLowerCase())) : produse.filter(p => p.categorie === categorieCurenta);
    lista.forEach(p => {
        grid.innerHTML += `<div class="product-card" onclick="adaugaProdus(${p.id})"><b>${p.nume}</b><span>${p.pret} lei</span></div>`;
    });
}

function filtreazaProduse() {
    textCautare = document.getElementById("searchProduseInput").value.trim();
    actualizeazaCategorii(); randeazaCatalog();
}

function adaugaProdus(id) {
    let p = produse.find(x => x.id === id);
    let exist = bonCurent.find(x => x.id === id);
    if(exist) exist.cantitate++; else bonCurent.push({...p, cantitate: 1});
    actualizeazaBonul();
}

function eliminaProdus(id) {
    let idx = bonCurent.findIndex(x => x.id === id);
    if(idx !== -1) {
        if(bonCurent[idx].cantitate > 1) bonCurent[idx].cantitate--;
        else bonCurent.splice(idx, 1);
    }
    actualizeazaBonul();
}

function actualizeazaBonul() {
    const container = document.getElementById("elementeBon"); container.innerHTML = "";
    let total = 0;
    
    if(bonCurent.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px 0; font-size:13px;">Coșul este gol. Apăsați pe produse pentru a le adăuga.</div>`;
        document.getElementById("txtTotal").innerText = "0.00 lei";
        return;
    }

    bonCurent.forEach(i => {
        total += i.pret * i.cantitate;
        container.innerHTML += `
            <div class="bill-item">
                <div>
                    <b style="font-size:14px; color:#fff;">${i.nume}</b><br>
                    <small style="color:var(--text-muted); font-weight:600;">${(i.pret * i.cantitate)} lei</small>
                </div>
                <div class="qty-controls">
                    <button class="btn-qty" onclick="eliminaProdus(${i.id})"><i class="fa-solid fa-minus"></i></button>
                    <span class="qty-num">${i.cantitate}</span>
                    <button class="btn-qty" onclick="adaugaProdus(${i.id})"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>`;
    });
    document.getElementById("txtTotal").innerText = total.toFixed(2) + " lei";
}

function deschidePlata() {
    if(bonCurent.length === 0) return;
    let total = bonCurent.reduce((s,i) => s + (i.pret*i.cantitate), 0);
    document.getElementById("txtSumaDePlata").innerText = total.toFixed(2) + " lei";
    document.getElementById("modalPlata").style.display = "flex";
}

function finalizeazaVanzare(metoda) {
    let total = bonCurent.reduce((s,i) => s + (i.pret*i.cantitate), 0);
    jurnalActivitati.push({ tip: "Vânzare (Events)", suma: total, metoda: metoda });
    if(metoda === "Cash") soldSertar += total;
    
    localStorage.setItem("q_core_sold", soldSertar);
    localStorage.setItem("q_core_jurnal", JSON.stringify(jurnalActivitati));
    
    inchideModal();
    bonCurent = [];
    actualizeazaBonul();
    alert("Tranzacție salvată cu succes!");
}

function inchideModal() { document.getElementById("modalPlata").style.display = "none"; }

/* MODUL MASTER */
function randeazaMaster() {
    document.getElementById("screen-login").classList.remove("active");
    document.getElementById("screen-master").classList.add("active");
    actualizeazaPanouMaster();
}

function actualizeazaPanouMaster() {
    let vanzariAzi = jurnalActivitati.filter(j => j.tip.includes("Vânzare")).reduce((s,j) => s + j.suma, 0);
    document.getElementById("txtKPIIncasari").innerText = vanzariAzi.toFixed(2) + " lei";
    document.getElementById("txtMasterSold").innerText = soldSertar.toFixed(2) + " lei";

    const tbody = document.getElementById("listaJurnal"); tbody.innerHTML = "";
    if(jurnalActivitati.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted); padding:14px 0;">Fără istoric tranzacții.</td></tr>`;
        return;
    }
    [...jurnalActivitati].reverse().forEach(j => {
        let isPlus = j.tip.includes("Vânzare") || j.tip.includes("Alimentare");
        tbody.innerHTML += `<tr>
            <td><b>${j.tip}</b></td>
            <td style="color:${isPlus?'var(--success-color)':'var(--danger-color)'}; font-family:monospace; font-weight:700;">${j.suma.toFixed(2)} lei</td>
            <td><span class="action-badge" style="padding:4px 8px; font-size:11px; pointer-events:none;">${j.metoda}</span></td>
        </tr>`;
    });
}

function modificaFond(dir) {
    let input = document.getElementById("numSumaSertar");
    let val = parseFloat(input.value);
    if(isNaN(val) || val <= 0) return;

    if(dir === "intrare") {
        soldSertar += val;
        jurnalActivitati.push({ tip: "Alimentare Sertar", suma: val, metoda: "Cash" });
    } else {
        if(val > soldSertar) { alert("Fonduri insuficiente în sertar!"); return; }
        soldSertar -= val;
        jurnalActivitati.push({ tip: "Retragere Fond", suma: val, metoda: "Cash" });
    }
    input.value = "";
    localStorage.setItem("q_core_sold", soldSertar);
    localStorage.setItem("q_core_jurnal", JSON.stringify(jurnalActivitati));
    actualizeazaPanouMaster();
}

function raport(tip) {
    let vanzari = jurnalActivitati.filter(j => j.tip.includes("Vânzare")).reduce((s,j) => s + j.suma, 0);
    alert(`=== RAPORT GENERAT: ${tip} ===\nTotal încasări brute: ${vanzari.toFixed(2)} lei\nSold actual sertar (Cash): ${soldSertar.toFixed(2)} lei`);
    if(tip === 'Z') {
        jurnalActivitati = [];
        localStorage.setItem("q_core_jurnal", JSON.stringify(jurnalActivitati));
        actualizeazaPanouMaster();
    }
}
</script>
